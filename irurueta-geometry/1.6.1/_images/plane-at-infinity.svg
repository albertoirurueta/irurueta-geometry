<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 400" font-family="'Segoe UI', Helvetica, Arial, sans-serif">
  <rect x="0" y="0" width="900" height="400" fill="#ffffff"/>
  <text x="450" y="26" text-anchor="middle" font-size="17" font-weight="600" fill="#111827">The plane at infinity &#928;&#8734; and the line at infinity l&#8734;</text>

  <!-- LEFT: projective view - cube with 3 vanishing points spanning the plane at infinity -->
  <g>
    <text x="225" y="50" text-anchor="middle" font-size="12.5" font-weight="600" fill="#334155">Projective view: 3 vanishing points span &#928;&#8734;</text>

    <!-- plane through the 3 vanishing points (the identified plane at infinity) -->
    <polygon points="230,68 349,308 123,308" fill="#fde68a" fill-opacity="0.28" stroke="#d97706" stroke-width="1.3" stroke-dasharray="5 3"/>
    <text x="255" y="150" font-size="15" font-weight="600" fill="#b45309">&#928;&#8734;</text>

    <!-- construction lines from each vanishing point through the parallel cube edges -->
    <g stroke="#94a3b8" stroke-width="0.8" stroke-dasharray="2.5 2.5">
      <!-- to Mz (vertical vanishing point) -->
      <line x1="230" y1="95.2" x2="236.9" y2="255.8"/>
      <line x1="230" y1="95.2" x2="195.5" y2="271.9"/>
      <line x1="230" y1="95.2" x2="267.8" y2="269.7"/>
      <line x1="230" y1="95.2" x2="226.9" y2="277.5"/>
      <!-- to Mx -->
      <line x1="323.5" y1="294.8" x2="236.9" y2="255.8"/>
      <line x1="323.5" y1="294.8" x2="195.5" y2="271.9"/>
      <line x1="323.5" y1="294.8" x2="234.9" y2="208.6"/>
      <line x1="323.5" y1="294.8" x2="202.2" y2="237.2"/>
      <!-- to My -->
      <line x1="136.5" y1="294.8" x2="236.9" y2="255.8"/>
      <line x1="136.5" y1="294.8" x2="234.9" y2="208.6"/>
      <line x1="136.5" y1="294.8" x2="267.8" y2="269.7"/>
      <line x1="136.5" y1="294.8" x2="259.8" y2="232.9"/>
    </g>

    <!-- cube wireframe (converges towards the 3 vanishing points) -->
    <polygon points="236.9,255.8 267.8,269.7 259.8,232.9 234.9,208.6" fill="#bfdbfe" stroke="none"/>
    <g stroke="#2563eb" stroke-width="1.7" fill="none" stroke-linejoin="round">
      <!-- x-edges (-> Mx) -->
      <line x1="236.9" y1="255.8" x2="267.8" y2="269.7"/>
      <line x1="195.5" y1="271.9" x2="226.9" y2="277.5"/>
      <line x1="234.9" y1="208.6" x2="259.8" y2="232.9"/>
      <line x1="202.2" y1="237.2" x2="227.4" y2="249.1"/>
      <!-- y-edges (-> Mz) -->
      <line x1="236.9" y1="255.8" x2="234.9" y2="208.6"/>
      <line x1="195.5" y1="271.9" x2="202.2" y2="237.2"/>
      <line x1="267.8" y1="269.7" x2="259.8" y2="232.9"/>
      <line x1="226.9" y1="277.5" x2="227.4" y2="249.1"/>
      <!-- z-edges (-> My) -->
      <line x1="236.9" y1="255.8" x2="195.5" y2="271.9"/>
      <line x1="234.9" y1="208.6" x2="202.2" y2="237.2"/>
      <line x1="267.8" y1="269.7" x2="226.9" y2="277.5"/>
      <line x1="259.8" y1="232.9" x2="227.4" y2="249.1"/>
    </g>

    <circle cx="323.5" cy="294.8" r="4" fill="#dc2626"/>
    <text x="330" y="292" font-size="12" fill="#dc2626">M<tspan baseline-shift="sub" font-size="9">X</tspan></text>
    <circle cx="136.5" cy="294.8" r="4" fill="#16a34a"/>
    <text x="102" y="292" font-size="12" fill="#16a34a">M<tspan baseline-shift="sub" font-size="9">Y</tspan></text>
    <circle cx="230" cy="95.2" r="4" fill="#d97706"/>
    <text x="236" y="87" font-size="12" fill="#d97706">M<tspan baseline-shift="sub" font-size="9">Z</tspan></text>
    <text x="225" y="330" text-anchor="middle" font-size="11" fill="#64748b">edges parallel in 3D meet at M<tspan baseline-shift="sub" font-size="8">X</tspan>, M<tspan baseline-shift="sub" font-size="8">Y</tspan>, M<tspan baseline-shift="sub" font-size="8">Z</tspan></text>
  </g>

  <!-- arrow: projective -> affine transformation -->
  <g fill="#94a3b8">
    <polygon points="420,185 460,185 460,172 490,200 460,228 460,215 420,215"/>
  </g>

  <!-- RIGHT: affine view - parallel edges, vanishing points sent back to infinity -->
  <g>
    <text x="710" y="50" text-anchor="middle" font-size="12.5" font-weight="600" fill="#334155">Affine view: vanishing points sent to infinity</text>

    <!-- rays extending the 3 parallel edge directions to infinity (no convergence) -->
    <g stroke="#94a3b8" stroke-width="0.9" stroke-dasharray="3 3">
      <!-- e1 / width direction (horizontal) -->
      <line x1="764" y1="172" x2="887.5" y2="172"/>
      <line x1="822" y1="106" x2="898" y2="106"/>
      <!-- e3 / height direction (leans off vertical: NOT perpendicular to e1, unlike a metric box) -->
      <line x1="727" y1="106" x2="741.4" y2="29.2"/>
      <line x1="822" y1="106" x2="836.4" y2="29.2"/>
      <!-- e2 / depth direction (diagonal, also not perpendicular to e1 or e3) -->
      <line x1="727" y1="106" x2="779.2" y2="46.6"/>
      <line x1="798" y1="234" x2="850.2" y2="174.6"/>
    </g>

    <!-- sheared parallelepiped: an affine (non-orthogonal) projection - parallelism is preserved
         but right angles are not, unlike the metric-looking box this replaces -->
    <polygon points="645,300 740,300 764,172 669,172" fill="#bbf7d0" fill-opacity="0.6" stroke="none"/>
    <polygon points="669,172 764,172 822,106 727,106" fill="#86efac" fill-opacity="0.7" stroke="none"/>
    <polygon points="740,300 798,234 822,106 764,172" fill="#a7f3d0" fill-opacity="0.7" stroke="none"/>
    <g stroke="#16a34a" stroke-width="1.7" fill="none" stroke-linejoin="round">
      <!-- front face (e1, e3) -->
      <line x1="645" y1="300" x2="740" y2="300"/>
      <line x1="740" y1="300" x2="764" y2="172"/>
      <line x1="764" y1="172" x2="669" y2="172"/>
      <line x1="669" y1="172" x2="645" y2="300"/>
      <!-- e2 / depth edges -->
      <line x1="645" y1="300" x2="703" y2="234"/>
      <line x1="740" y1="300" x2="798" y2="234"/>
      <line x1="764" y1="172" x2="822" y2="106"/>
      <line x1="669" y1="172" x2="727" y2="106"/>
      <!-- back face -->
      <line x1="703" y1="234" x2="798" y2="234"/>
      <line x1="798" y1="234" x2="822" y2="106"/>
      <line x1="822" y1="106" x2="727" y2="106"/>
      <line x1="727" y1="106" x2="703" y2="234"/>
    </g>
    <text x="710" y="325" text-anchor="middle" font-size="11" fill="#64748b">edges that met at M<tspan baseline-shift="sub" font-size="8">X</tspan>/M<tspan baseline-shift="sub" font-size="8">Y</tspan>/M<tspan baseline-shift="sub" font-size="8">Z</tspan> are now parallel</text>
    <text x="710" y="340" text-anchor="middle" font-size="11" fill="#64748b">(right angles are still not preserved in the affine stratum)</text>
  </g>

  <text x="30" y="382" font-size="12.5" fill="#334155">&#928;&#8734; = (0,0,0,1)&#7488;  (canonical form, only in the affine/metric/Euclidean strata)</text>
  <text x="470" y="382" font-size="12.5" fill="#334155">l&#8734; = line through the vanishing points, lying in &#928;&#8734;</text>
</svg>
